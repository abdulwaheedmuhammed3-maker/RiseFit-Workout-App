name: RiseFit build

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Capture generated dependency lock for pinning
        uses: actions/upload-artifact@v4
        with:
          name: risefit-generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Type-check and build
        run: npm run build
